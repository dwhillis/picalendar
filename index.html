<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800, height=480">
    <title>E-Ink Calendar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/ical.js/dist/ical.es5.min.cjs"></script>

</head>
<body>
    <div class="main-container">
        <div class="container">
            <!-- Left Panel: Month Calendar -->
            <div class="calendar-panel">
                <div class="month-header">
                    <h1 id="month-year"></h1>
                </div>
                <div class="calendar-grid">
                    <div class="day-header">Sun</div>
                    <div class="day-header">Mon</div>
                    <div class="day-header">Tue</div>
                    <div class="day-header">Wed</div>
                    <div class="day-header">Thu</div>
                    <div class="day-header">Fri</div>
                    <div class="day-header">Sat</div>
                    <div id="calendar-days"></div>
                </div>
                <!-- Weather Forecast -->
                <div class="weather-panel">
                    <div id="weather-forecast" class="weather-forecast">
                        <div class="loading">Loading weather...</div>
                    </div>
                </div>
            </div>
            <!-- Right Panel: Upcoming Events -->
            <div class="events-panel">
                <div id="events-list" class="events-list">
                    <div class="loading">Loading events...</div>
                </div>
            </div>
        </div>

    </div>

    <script src="config.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
